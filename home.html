<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- tailwind and daisy link -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icon link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>

</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <!-- header part start here -->
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-1">
                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="">
                </div>
                <div class="balance_info">
                    <h2 class="text-2xl font-bold">$ <span id="currentBalance">45000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>
            <div class="right">
                <a href="./index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout</a>
            </div>
        </section>
    </header>
    <!-- header part end here -->

    <section class="w-11/12 mx-auto py-10 space-y-5">
        <h2 class="text-3xl font-bold">Welcom to pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

        <div class="buttons grid grid-cols-3 gap-3">
            <button onclick="showOnly('add_money')" class="btn flex-col h-full py-[20px] btn-primary btn-soft">
                <img src="./assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button onclick="showOnly('cashOut')" class="btn flex-col h-full py-[20px] btn-primary btn-soft">
                <img src="./assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button onclick="showOnly('send_money')" class="btn flex-col h-full py-[20px] btn-primary btn-soft">
                <img src="./assets/opt-3.png" alt="">
                <p>Send Money</p>
            </button>
            <button onclick="showOnly('getBonus')" class="btn flex-col h-full py-[20px] btn-primary btn-soft">
                <img src="./assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button onclick="showOnly('paybill')" class="btn flex-col h-full py-[20px] btn-primary btn-soft">
                <img src="./assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button onclick="showOnly('history')" class="btn flex-col h-full py-[20px] btn-primary btn-soft">
                <img src="./assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
        </div>
    </section>

    <!-- addMoney part start here --> 
    <section id="add_money" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold">Add Money</h2>
        <div class="form pt-10 ">
            <div class="card bg-base-100 w-full shadow-xl rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-bold">Select A Bank</label>
                        <select id="add_money_bank" class="select w-full rounded-full">
                            <option disabled selected>Select a Bank</option>
                            <option value="DBBL">DBBL</option>
                            <option value="Uttara Bank">Uttara Bank</option>
                            <option value="Islamic Bank">Islamic Bank</option>
                            <option value="IBBL">IBBL</option>
                            <option value="City Bank">City Bank</option>
                        </select>

                        <label class="label text-neutral font-bold">Bank Account Number</label>
                        <input id="bank_account_number" maxlength="11" minlength="11" type="text"
                            class="input rounded-full w-full" placeholder="Enter 11 digit account number" />

                        <label class="label text-neutral font-bold">Amount to Add</label>
                        <input id="amount_add" type="number" class="input rounded-full w-full"
                            placeholder="Add Amount to withdraw" />

                        <label class="label text-neutral font-bold">Pin Number</label>
                        <input id="bankPin_number" maxlength="4" minlength="4" type="password"
                            class="input rounded-full w-full" placeholder="Enter 4 digit pin number" />
                        <button id="addMoney_btn" class="btn btn-primary mt-4 rounded-full">Add Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>
    <!-- cashout part start here -->
    <section id="cashOut" class="w-11/12 mx-auto py-5">
        <h2 class="text-2xl font-bold">Cashout</h2>
        <div class="form pt-10 ">
            <div class="card bg-base-100 w-full shadow-xl rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-bold">Agent Number</label>
                        <input id="agentNumber" maxlength="11" minlength="11" type="text"
                            class="input rounded-full w-full" placeholder="Enter agent 11 digit Number" />

                        <label class="label text-neutral font-bold">Amount</label>
                        <input id="cashoutAmount" type="number" class="input rounded-full w-full"
                            placeholder="Enter amount to withdraw" />

                        <label class="label text-neutral font-bold">4 Digit Pin</label>
                        <input id="cashoutPin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full w-full" placeholder="Enter 4 digit pin" />
                        <button id="cashout_btn" class="btn btn-primary mt-4 rounded-full">WithDraw Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>
    <!-- sendMoney part start here -->
    <section id="send_money" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold">Send Money</h2>
    </section>
    <!-- sendMoney part end here -->
    <!-- paybill part start here -->
    <section id="paybill" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold">Paybill</h2>
    </section>
    <!-- paybill part end here -->
    <!-- getBonus part start here -->
    <section id="getBonus" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold">Get Bonus</h2>
    </section>
    <!-- paybill part end here -->
    <!-- history part start here -->
    <section id="history" class="w-11/12 mx-auto py-5 spay-5 hidden">
        <h2 class="text-2xl font-bold">Transaction</h2>
        <div class="pt-5" id="history_container">
            
        </div>
    </section>
    <!-- history part end here -->
    <!-- js added  -->
    <script src="script/machine.js"></script>
    <script src="script/addmoney.js"></script>
    <script src="script/cashout.js"></script>
</body>

</html>
